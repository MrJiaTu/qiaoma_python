# ============================================================
# 敲码（qiaoma）课程清单
# 课题顺序即学习顺序；题目文件与检查文件按镜像路径存放：
#   exercises/<topic>/<id>.py  <-->  checks/<topic>/<id>.py
# ============================================================

[[topics]]
id = "variables"
name = "变量与类型"
track = "初级"
description = "从食堂饭卡到公交充值，认识变量、数字、字符串与布尔。"

[[exercises]]
id = "variables01"
topic = "variables"
title = "食堂饭卡找零"
hints = [
    "刷卡后余额会变少，想想该用哪个运算符。",
    "balance = card_money - noodle_price",
]

[[exercises]]
id = "variables02"
topic = "variables"
title = "出生年份算年龄"
hints = [
    "年龄 = 当前年份 - 出生年份，别减反了。",
    "age = current_year - birth_year",
]

[[exercises]]
id = "variables03"
topic = "variables"
title = "奶茶拼单"
hints = [
    "三杯都要付钱，减号改成加号。",
    "total = cup_a + cup_b + cup_c",
]

[[exercises]]
id = "variables04"
topic = "variables"
title = "体检身高换算"
hints = [
    "厘米变米是变小，应该除以 100。",
    "height_m = height_cm / 100",
]

[[exercises]]
id = "variables05"
topic = "variables"
title = "快递计费重量"
hints = [
    "weight_kg 现在是字符串，不能直接参与数学运算。",
    "先用 float(weight_kg) 转成数字再算运费。",
]

[[exercises]]
id = "variables06"
topic = "variables"
title = "食堂开门了吗"
hints = [
    "营业时间 10 点到 19 点，hour 在这个区间内就是开门。",
    "is_open = 10 <= hour < 19",
]

[[exercises]]
id = "variables07"
topic = "variables"
title = "交换早餐"
hints = [
    "直接 a = b; b = a 会把原来的值弄丢。",
    "用第三个变量暂存，或者 a, b = b, a。",
]

[[exercises]]
id = "variables08"
topic = "variables"
title = "超市小票总价"
hints = [
    "字符串相加会变成拼接，比如 '3' + '6' = '36'。",
    "先用 float() 把每个价格转成数字再求和。",
]

[[exercises]]
id = "variables09"
topic = "variables"
title = "公交卡充值扣费"
hints = [
    "充值 50 元是在原有余额上增加，不是覆盖。",
    "balance = balance + 50，再减掉 3 次 2 元车费。",
]

[[exercises]]
id = "variables10"
topic = "variables"
title = "校园个人名片"
hints = [
    "int() 可以把 '20' 这样的字符串变成整数。",
    "检查每个变量该有的类型：名字是 str，年龄是 int，身高是 float。",
]

